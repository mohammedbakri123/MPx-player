# CI — debug build + unit tests on every pull request, and the minified
# release build on demand (manual dispatch), on version-tag pushes, or
# on pull requests that touch build/proguard/playback/di/manifest paths (D-18, D-19).
#
# Instrumented device tests run on an Android emulator in a separate job (CP-4)
# on demand (workflow_dispatch), scheduled weekly, on version-tag pushes, or
# on pull requests that touch androidTest or playback engine paths.
#
# Runs on GitHub-hosted runners, which have normal internet access, so the
# mpv AAR and Gradle plugins resolve directly (unlike the maintainer's
# local setup — see CONTRIBUTING.md for the offline / local-Maven notes).
#
# The minified build runs on PRs when R8/reflection-sensitive paths change,
# and verifies R8-kept classes (e.g. is.xyz.mpv) via dexdump smoke assertions.
# It used to run only on the maintainer's machine, but the local
# Gradle daemon cannot dispatch to its forked daemon on this VM
# (Broken pipe on the first client write, daemon never accepts — see the
# migration mission log, 2026-11-11), so the release APK is built here
# instead and verified from the downloaded file before any release is cut.
# A tag-triggered run checks out the tag itself, so the APK stamps its
# own tag exactly as the local release flow requires.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' # Weekly Monday at 03:00 UTC

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # PRs and branch pushes only — a tag push runs build-minified, not this.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # NOTE: do not list the obsolete `tools` package here — the
          # action's default package list includes it and sdkmanager
          # fails the run with "Failed to find package 'tools'".
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Build debug + run unit tests
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest

  lint:
    # Release lint checks on CI (Step 6.3). Kept separate from local offline
    # builds because lint-gradle is not seeded in the offline repository.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Run Android Lint (release)
        run: ./gradlew --no-daemon lintRelease

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results*.*
          retention-days: 14

  changes:
    # Path-filter check for pull requests: determines whether R8/reflection-sensitive
    # paths were modified, warranting a minified build run (D-19), or whether
    # androidTest/playback paths were modified, warranting an emulator run (CP-4).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      should_minify: ${{ steps.check.outputs.should_minify }}
      should_test_device: ${{ steps.check.outputs.should_test_device }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        name: Check for changed paths
        run: |
          BASE_REF="origin/${{ github.base_ref }}"
          DIFF=$(git diff --name-only "$BASE_REF"...HEAD 2>/dev/null || git diff --name-only ${{ github.event.pull_request.base.sha }} HEAD 2>/dev/null || true)
          echo "Changed files in PR:"
          echo "$DIFF"
          if echo "$DIFF" | grep -q -E '^(gradle/|.*\.gradle\.kts$|gradle\.properties$|app/proguard-rules\.pro$|app/src/main/AndroidManifest\.xml$|app/src/main/java/com/mpx/player/playback/|app/src/main/java/com/mpx/player/di/)'; then
            echo "R8-sensitive files changed; minified build enabled."
            echo "should_minify=true" >> "$GITHUB_OUTPUT"
          else
            echo "No R8-sensitive files changed; skipping minified build."
            echo "should_minify=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$DIFF" | grep -q -E '^(app/src/androidTest/|app/src/main/java/com/mpx/player/playback/)'; then
            echo "Device test/playback files changed; instrumented test enabled."
            echo "should_test_device=true" >> "$GITHUB_OUTPUT"
          else
            echo "No device test/playback files changed; skipping instrumented test."
            echo "should_test_device=false" >> "$GITHUB_OUTPUT"
          fi

  build-minified:
    # Manual dispatch, version-tag push (v0.4.55, ...), or PRs touching
    # gradle, proguard, playback, di, or manifest (D-18, D-19).
    needs: [changes]
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'pull_request' && needs.changes.outputs.should_minify == 'true')
      )
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags: versionName/versionCode come from
          # `git describe --tags`, so the APK stamps its own tag.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # NOTE: do not list the obsolete `tools` package here — the
          # action's default package list includes it and sdkmanager
          # fails the run with "Failed to find package 'tools'".
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Build minified release APKs
        run: ./gradlew --no-daemon assembleMinified

      - name: Verify R8-kept classes (smoke assertion)
        run: |
          DEXDUMP=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name dexdump | sort -V | tail -n 1)
          if [ -z "$DEXDUMP" ] || [ ! -x "$DEXDUMP" ]; then
            echo "Error: dexdump not found in Android SDK"
            exit 1
          fi
          for apk in app/build/outputs/apk/minified/app-*-minified.apk; do
            test -f "$apk" || { echo "Error: Expected minified APK missing: $apk"; exit 1; }
            echo "Checking kept classes in $apk..."
            mpv_count=$("$DEXDUMP" "$apk" | grep -c "Class descriptor.*Lis/xyz/mpv/" || true)
            echo "Found $mpv_count kept is.xyz.mpv classes in $apk"
            if [ "$mpv_count" -le 0 ]; then
              echo "Assertion failed: No is.xyz.mpv classes found in $apk! R8 may have stripped required native reflection/JNI wrapper classes."
              exit 1
            fi
          done

      - name: Upload minified APKs
        uses: actions/upload-artifact@v4
        with:
          name: mpx-minified-apks
          path: app/build/outputs/apk/minified/**/app-*-minified.apk
          retention-days: 14

  test-instrumented:
    # Manual dispatch, weekly schedule, version-tag push, or PRs touching
    # androidTest or playback paths (CP-4).
    # Runs on an emulator via reactivecircus/android-emulator-runner; separate
    # from the main build job so slow/flaky emulator runs never block unit tests.
    needs: [changes]
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'schedule' ||
        startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'pull_request' && needs.changes.outputs.should_test_device == 'true')
      )
    runs-on: ubuntu-24.04
    steps:
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # NOTE: do not list the obsolete `tools` package
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Run instrumented tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: app/build/reports/androidTests/connected/
          retention-days: 14
