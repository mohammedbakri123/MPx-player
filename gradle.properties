# Enable AndroidX
android.useAndroidX=true

# AGP 10 preparation: new DSL and built-in Kotlin enabled
android.newDsl=true
android.builtInKotlin=true

# Let AGP fetch a missing SDK platform/build-tools itself if sdkmanager
# has not finished yet.
android.builder.sdkDownload=true

# Kotlin code style
kotlin.code.style=official

# Compile directly in-process to avoid daemon socket communication issues on VM
kotlin.compiler.execution.strategy=in-process

# Disable persistent Gradle daemon
org.gradle.daemon=false

# JVM arguments with IPv4 preference and extended cache lock timeout
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true -Dorg.gradle.cache.lock.timeout=900000
systemProp.org.gradle.cache.lock.timeout=900000
