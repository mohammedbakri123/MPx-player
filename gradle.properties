# Enable AndroidX
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Compile directly in-process to avoid daemon socket communication issues on VM
kotlin.compiler.execution.strategy=in-process

# Disable persistent Gradle daemon
org.gradle.daemon=false

# JVM arguments with IPv4 preference
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
